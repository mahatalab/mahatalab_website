<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Website — Mahata Lab</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#3B245C;--pur:#5B3A82;--vio:#7656A6;--lav:#B9A7D9;--pale:#F3F0F8;--ch:#242129;--sl:#625B6B}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:var(--ch);background:#FAFAFC;font-size:14px;display:flex;flex-direction:column;height:100vh}
header{background:#2A193F;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.06em;flex:1}header a{color:var(--lav);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--lav);background:#fff;color:var(--plum);border-radius:4px;padding:6px 12px}
button:hover{background:var(--pale)}button.pri{background:var(--pur);color:#fff;border-color:var(--pur)}button.pri:hover{background:var(--plum)}
button.dng{color:#a12;border-color:#e3b}.sm{padding:3px 8px;font-size:12px}
.main{flex:1;display:grid;grid-template-columns:170px minmax(340px,1fr) minmax(300px,1fr);min-height:0}
nav{background:var(--pale);border-right:1px solid var(--lav);overflow:auto;padding:10px}
nav button{display:block;width:100%;text-align:left;margin-bottom:6px;border-color:transparent;background:transparent}
nav button.on{background:#fff;border-color:var(--lav);font-weight:600}
.form{overflow:auto;padding:18px 22px 60px}.form h2{margin:0 0 14px;color:var(--plum);font-size:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--sl);margin:12px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--lav);border-radius:4px;background:#fff}
textarea{min-height:90px;resize:vertical}
fieldset{border:1px solid var(--lav);border-radius:6px;margin:12px 0;padding:6px 12px 12px;background:#fff}legend{font-weight:600;color:var(--pur);padding:0 6px}
.item{border:1px solid var(--lav);border-radius:6px;margin:10px 0;background:#fff}.item>.bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--pale);cursor:pointer}
.item>.bar b{flex:1;font-size:13px;color:var(--plum);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.item>.body{padding:4px 14px 14px;display:none}.item.open>.body{display:block}
.rt{border:1px solid var(--lav);border-radius:4px;background:#fff}.rt .tb{display:flex;gap:4px;flex-wrap:wrap;padding:5px;border-bottom:1px solid var(--lav);background:var(--pale);align-items:center}
.rt .tb button{padding:2px 8px;font-size:12px}.rt .tb input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--lav)}
.rt .ed{min-height:100px;padding:9px;outline:none;line-height:1.55}.rt .ed:focus{box-shadow:inset 0 0 0 2px #7656A633}
.imgf{display:flex;gap:10px;align-items:center}.imgf img{width:60px;height:60px;object-fit:cover;border:1px solid var(--lav);border-radius:4px;background:#fff}.imgf .x{flex:1}
.prev{border-left:1px solid var(--lav);display:flex;flex-direction:column;min-height:0}.prev .pb{padding:6px 10px;background:var(--pale);font-size:12px;color:var(--sl)}.prev iframe{flex:1;border:0;width:100%}
.pub{background:#fff;border:1px solid var(--lav);border-radius:6px;padding:4px 14px 14px;margin-top:20px}.msg{font-size:12.5px;margin-top:10px;white-space:pre-wrap}.ok{color:#176b3a}.er{color:#a12}
.hint{font-size:12px;color:var(--sl);margin:4px 0}
@media(max-width:1000px){.main{grid-template-columns:140px 1fr}.prev{display:none}}
</style></head>
<body>
<header><h1>EDIT WEBSITE · MAHATA LAB</h1><span id="status" style="font-size:12px;color:var(--lav)"></span>
<button id="draft">Save draft</button><button id="dl">Download site.js</button><button id="reset">Discard changes</button><button class="pri" id="topub">Publish…</button><a href="../index.html">← Back to site</a></header>
<div class="main"><nav id="nav"></nav><div class="form" id="form"></div>
<div class="prev"><div class="pb">Live preview (updates as you type)</div><iframe id="frame" title="Site preview" src="../index.html"></iframe></div></div>
<script src="../content/site.js"></script><script src="editor.js"></script></body></html>
